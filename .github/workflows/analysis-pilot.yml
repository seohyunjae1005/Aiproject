name: Pilot semiconductor job analysis

on:
  workflow_dispatch:
    inputs:
      article_limit:
        description: "분석할 기업별 대표 기사 수"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "6"
          - "11"

permissions:
  contents: write

concurrency:
  group: repository-data-updates
  cancel-in-progress: false

jobs:
  analysis-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract representative public official articles
        run: python scripts/extract_article_bodies.py

      - name: Prepare evidence-grounded analysis requests
        run: python scripts/build_analysis_requests.py

      - name: Analyze selected articles with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANALYSIS_MAX_ARTICLES: ${{ inputs.article_limit }}
        run: python scripts/analyze_sample_articles.py

      - name: Preserve machine-validated company analyses
        run: python scripts/merge_analysis_cache.py

      - name: Commit validated analysis cache
        run: |
          if git diff --quiet -- data/analysis/validated_cache.json; then
            echo "No validated analysis cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/validated_cache.json
          git commit -m "Update validated semiconductor analysis cache"
          git pull --rebase origin main
          git push

      - name: Upload review-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-pilot-results
          path: |
            runtime/analysis_results.json
            runtime/analysis_validation.md
            runtime/analysis_cache_update.md
          if-no-files-found: warn
          retention-days: 7
